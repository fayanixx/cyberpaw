name: Build CYBERPAW Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm install

      # ----------------------------------------------------------
      # 4. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build

      # ----------------------------------------------------------
      # 5. Install Java 21
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ----------------------------------------------------------
      # 6. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ----------------------------------------------------------
      # 7. Add Android platform if missing & Sync
      # ----------------------------------------------------------
      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      # ----------------------------------------------------------
      # 8. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ----------------------------------------------------------
      # 9. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      # ----------------------------------------------------------
      # 10. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ----------------------------------------------------------
      # 11. Rename the generated APK
      # ----------------------------------------------------------
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CYBERPAW.apk

      # ----------------------------------------------------------
      # 12. Upload APK to GitHub Actions Artifacts
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CYBERPAW-APK
          path: CYBERPAW.apk
          if-no-files-found: error
          retention-days: 30